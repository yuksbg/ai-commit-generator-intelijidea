name: Build plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out sources
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'
          cache-provider: basic

      - name: Generate version
        id: version
        shell: bash
        run: |
          base_version="$(python3 -c 'import xml.etree.ElementTree as ET; print(ET.parse("src/main/resources/META-INF/plugin.xml").getroot().findtext("version"))')"
          if [[ ! "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a numeric major.minor.patch base version, got: $base_version" >&2
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$base_version"
          version="${major}.${minor}.$((10#$patch + GITHUB_RUN_NUMBER))"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          printf 'Plugin version: `%s`\n\nCommit: `%s`\n' "$version" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Test and build plugin
        env:
          PLUGIN_VERSION: ${{ steps.version.outputs.version }}
        run: gradle --no-daemon --stacktrace check buildPlugin -PpluginVersion="$PLUGIN_VERSION"

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ai-commit-message-${{ steps.version.outputs.version }}
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PLUGIN_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          tag="v${PLUGIN_VERSION}"
          archive="build/distributions/ai-commit-message-${PLUGIN_VERSION}.zip"
          test -f "$archive"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$archive" --clobber
          else
            notes="$RUNNER_TEMP/release-notes.md"
            printf 'Automated build from commit `%s`.\n\nDownload the `ai-commit-message-*.zip` asset and install it via **Settings → Plugins → gear menu → Install Plugin from Disk**.\n\nRequires IntelliJ IDEA or GoLand 2026.2 (build 262).\n' "$GITHUB_SHA" > "$notes"
            gh release create "$tag" "$archive" \
              --target "$GITHUB_SHA" \
              --title "AI Commit Message generator by 0config.eu ${PLUGIN_VERSION}" \
              --notes-file "$notes"
          fi
          release_url="$(gh release view "$tag" --json url --jq .url)"
          printf '\n[Download plugin release](%s)\n' "$release_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ steps.version.outputs.version }}
          path: build/reports/
          if-no-files-found: ignore
          retention-days: 14
