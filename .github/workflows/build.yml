name: Build plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out sources
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'
          cache-provider: basic

      - name: Generate version
        id: version
        shell: bash
        run: |
          version="0.1.2-ci.${GITHUB_RUN_NUMBER}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          printf 'Plugin version: `%s`\n\nCommit: `%s`\n' "$version" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Test and build plugin
        env:
          PLUGIN_VERSION: ${{ steps.version.outputs.version }}
        run: gradle --no-daemon --stacktrace check buildPlugin -PpluginVersion="$PLUGIN_VERSION"

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ai-commit-message-${{ steps.version.outputs.version }}
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ steps.version.outputs.version }}
          path: build/reports/
          if-no-files-found: ignore
          retention-days: 14
